<!DOCTYPE html>
<html>
  <head>
    <title>Holographic Console</title>
    <style>
      body { margin:0; color:#d8f0f2; font-size:14px; line-height:1.3; }
      main { width:440px; height:228px; padding:12px; background-color:#123442; }
      h2 { font-size:22px; margin:0 0 10px; color:#00d0cd; }
      p { margin:0 0 12px; }
      label { margin:0 0 4px; }
      input { width:300px; height:24px; margin:0 0 12px; }
    </style>
  </head>
  <body>
    <main id="panel">
      <h2>Holographic Console</h2>
      <p>Power distribution</p>
      <label for="level">Engine output</label>
      <input id="level" type="range" min="0" max="100" step="1" value="60" data-bind="level" data-action="level"/>
      <p>Level: <span>{{level}}</span>%</p>
    </main>
  </body>
</html>
