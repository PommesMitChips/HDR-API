<main id="panel">
  <h2>HDR HTML</h2>
  <p>Local HTML/CSS - no browser plugin</p>
  <p>Tick <span>{{clock}}</span></p>
  <label>Level</label>
  <input id="level" type="range" min="0" max="100" step="1" value="60" data-bind="level" data-action="level" />
  <button id="reset" data-action="reset">Reset</button>
  <p id="note">Input supplied by an owned GUI.</p>
</main>
