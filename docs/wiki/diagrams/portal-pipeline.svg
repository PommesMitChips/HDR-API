<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="747" viewBox="0 0 1120 747" role="img" aria-labelledby="title desc"><title id="title">Native portal: transport the view, keep physics local</title><desc id="desc">Paired planes use a projective capture; non-linear surface mappings require their own ray and composition path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#46747b"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243541}.heading{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526573}.label{font-size:19px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#526573}.card{stroke-width:1.5}.teal{fill:#e3f0ef;stroke:#568b8b}.gold{fill:#fbf0d9;stroke:#b59657}.neutral{fill:#fff;stroke:#adbcc4}.proposed{fill:#f0edf7;stroke:#8e7fa5;stroke-dasharray:6 4}.flow{fill:none;stroke:#46747b;stroke-width:2.5}.divider{stroke:#c4d0d7;stroke-width:1.3;stroke-dasharray:5 5}</style><rect width="1120" height="747" rx="18" fill="#f4f7f9"/><text x="40" y="52" class="heading">Native portal: transport the view, keep physics local</text><text x="40" y="82" class="sub">Paired planes use a projective capture; non-linear surface mappings require their own ray and composition path.</text><g fill="none"><path d="M105,215 L265,170 L265,335 L105,290 Z" fill="#d8eeec" stroke="#568b8b" stroke-width="2"/><path d="M760,170 L915,215 L915,290 L760,335 Z" fill="#d8eeec" stroke="#568b8b" stroke-width="2"/><circle cx="920" cy="252" r="112" fill="#fbf0d9" fill-opacity="0.65" stroke="#b59657" stroke-width="2"/><path d="M65,252 L240,245" class="flow" marker-end="url(#arrow)"/><path d="M805,245 L1050,220" class="flow" marker-end="url(#arrow)"/><path d="M270,252 L715,252" class="flow" marker-end="url(#arrow)"/></g><text x="43" y="220" class="small">eye</text><text x="120" y="372" class="label">Entry plane</text><text x="450" y="230" class="label">Transport viewing ray</text><text x="738" y="389" class="label">Exit + capture shell</text><text x="831" y="420" class="body">Start beyond shell boundary</text><text x="385" y="290" class="body">Paired planes: projective mapping</text><g><rect x="40" y="450" width="300" height="155" rx="14" class="card teal"/><text x="62" y="484" class="label">1 · Declare and authorize</text><text x="62" y="516" class="body">Entry / exit poses + shell</text><text x="62" y="540" class="body">Strict or approximate mapping</text><text x="62" y="564" class="body">Requested detail and cadence</text><text x="62" y="588" class="body">Server validates bounded intent</text></g><g><rect x="405" y="450" width="300" height="155" rx="14" class="card gold"/><text x="427" y="484" class="label">2 · Capture locally</text><text x="427" y="516" class="body">Snapshot current primary view</text><text x="427" y="540" class="body">Capture before primary drawing</text><text x="427" y="564" class="body">Clip geometry / clouds at shell</text><text x="427" y="588" class="body">Pixels stay paired with projection</text></g><g><rect x="770" y="450" width="310" height="155" rx="14" class="card teal"/><text x="792" y="484" class="label">3 · Present through entry</text><text x="792" y="516" class="body">Paired plane: cropped capture</text><text x="792" y="540" class="body">Direct projective texture sampling</text><text x="792" y="564" class="body">Local world depth / transparency</text><text x="792" y="588" class="body">Curved shapes use composition</text></g><path d="M340,528 L405,528" class="flow" marker-end="url(#arrow)"/><path d="M705,528 L770,528" class="flow" marker-end="url(#arrow)"/><text x="40" y="652" class="body">Shell clipping excludes nearby content inside the capture boundary; it does not teleport physics or entities.</text><text x="40" y="679" class="body">A held image still represents its captured eye pose. Requested refresh is a ceiling, not a guaranteed frame rate.</text><text x="40" y="723" class="small">HDR API · architecture guide · solid = implemented; dashed = proposed</text></svg>