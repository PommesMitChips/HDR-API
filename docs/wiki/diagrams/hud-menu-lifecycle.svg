<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Full HUD / menu composition: keep ownership explicit</title><desc id="desc">A client-local mod API separates scene lifetime, presentation and caller-supplied pointer interaction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#46747b" /></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243541}.heading{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526573}.label{font-size:19px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#526573}.card{stroke-width:1.5}.teal{fill:#e3f0ef;stroke:#568b8b}.gold{fill:#fbf0d9;stroke:#b59657}.neutral{fill:#fff;stroke:#adbcc4}.proposed{fill:#f0edf7;stroke:#8e7fa5;stroke-dasharray:6 4}.flow{fill:none;stroke:#46747b;stroke-width:2.5}.divider{stroke:#c4d0d7;stroke-width:1.3;stroke-dasharray:5 5}</style><rect width="1120" height="720" rx="18" fill="#f4f7f9" /><text x="40" y="52" class="heading">Full HUD / menu composition: keep ownership explicit</text><text x="40" y="82" class="sub">A client-local mod API separates scene lifetime, presentation and caller-supplied pointer interaction.</text><g><rect x="40" y="125" width="300" height="160" rx="14" class="card teal" /><text x="62" y="159" class="label">Mod: owned client endpoint</text><text x="62" y="191" class="body">Create HUD / world contexts</text><text x="62" y="215" class="body">Retain SVG, text, images, meshes</text><text x="62" y="239" class="body">Set context / item presentation</text><text x="62" y="263" class="body">Release endpoint on unload</text></g><g><rect x="410" y="125" width="300" height="160" rx="14" class="card teal" /><text x="432" y="159" class="label">HDR: local presentation</text><text x="432" y="191" class="body">HUD: near-clip PostPP · depth-tested</text><text x="432" y="215" class="body">World: standard scene depth</text><text x="432" y="239" class="body">Independent consumer order</text><text x="432" y="263" class="body">No PB / server declarations</text></g><g><rect x="780" y="125" width="300" height="160" rx="14" class="card teal" /><text x="802" y="159" class="label">Cooperative input</text><text x="802" y="191" class="body">Owner supplies pointer state</text><text x="802" y="215" class="body">Explicit bounds → hit testing</text><text x="802" y="239" class="body">Poll bounded local events</text><text x="802" y="263" class="body">No global mouse capture</text></g><path d="M340,205 L410,205" class="flow" marker-end="url(#arrow)" /><path d="M710,205 L780,205" class="flow" marker-end="url(#arrow)" /><path d="M930,285 L930,325 L190,325 L190,285" class="flow" marker-end="url(#arrow)" /><text x="418" y="352" class="body">Return trusted local interaction to the owning mod</text><g><rect x="40" y="410" width="500" height="190" rx="14" class="card teal" /><text x="62" y="444" class="label">Implemented: block-bound HDR.UI</text><text x="62" y="476" class="body">LCD / anchor-plane registered buttons and bundles</text><text x="62" y="500" class="body">Aim + native Use interaction; server validates actions</text><text x="62" y="524" class="body">Fixed PB arguments, layer toggles and menu grants</text><text x="62" y="548" class="body">Menu visibility can be viewer-local</text><text x="62" y="572" class="body">Mouse focus currently falls back to look-and-use</text></g><g><rect x="580" y="410" width="500" height="190" rx="14" class="card gold" /><text x="602" y="444" class="label">Implemented: display-source providers</text><text x="602" y="476" class="body">Local mesh / RGBA / material frames</text><text x="602" y="500" class="body">Visible demand informs producer resolution and rate</text><text x="602" y="524" class="body">Opaque evidence is checked before presentation</text><text x="602" y="548" class="body">Generation-safe release on replacement / unload</text><text x="602" y="572" class="body">Does not grant a general HUD scene or input lease</text></g><text x="40" y="650" class="body">Mod contexts are client-local. Pointer state comes from the caller; HDR does not acquire game input.</text><text x="40" y="696" class="small">HDR API · architecture guide · solid = implemented; dashed = proposed</text></svg>