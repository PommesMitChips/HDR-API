<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">One display library; distinct caller capabilities</title><desc id="desc">Physical screens and projection anchors have different output capabilities and permission boundaries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#46747b" /></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243541}.heading{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526573}.label{font-size:19px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#526573}.card{stroke-width:1.5}.teal{fill:#e3f0ef;stroke:#568b8b}.gold{fill:#fbf0d9;stroke:#b59657}.neutral{fill:#fff;stroke:#adbcc4}.proposed{fill:#f0edf7;stroke:#8e7fa5;stroke-dasharray:6 4}.flow{fill:none;stroke:#46747b;stroke-width:2.5}.divider{stroke:#c4d0d7;stroke-width:1.3;stroke-dasharray:5 5}</style><rect width="1120" height="720" rx="18" fill="#f4f7f9" /><text x="40" y="52" class="heading">One display library; distinct caller capabilities</text><text x="40" y="82" class="sub">Physical screens and projection anchors have different output capabilities and permission boundaries.</text><g><rect x="40" y="125" width="330" height="275" rx="14" class="card teal" /><text x="62" y="159" class="label">Physical LCD</text><text x="62" y="191" class="body">Native LCD output</text><text x="62" y="215" class="body">Calibrated vector output</text><text x="62" y="239" class="body">Drawing, SVG, text and layers</text><text x="62" y="263" class="body">LCD walls / tile composition</text><text x="62" y="287" class="body">HDR.UI: aim + Use interaction</text><text x="62" y="311" class="body">No floating screen anchor</text></g><g><rect x="395" y="125" width="330" height="275" rx="14" class="card teal" /><text x="417" y="159" class="label">Console / Holo Table</text><text x="417" y="191" class="body">Retained 3D geometry + labels</text><text x="417" y="215" class="body">Live construct previews</text><text x="417" y="239" class="body">Floating projected screens</text><text x="417" y="263" class="body">Plane, curved and UV-mesh shapes</text><text x="417" y="287" class="body">Raster / camera / portal sources</text><text x="417" y="311" class="body">Table envelope can clip output</text></g><g><rect x="750" y="125" width="330" height="275" rx="14" class="card teal" /><text x="772" y="159" class="label">Projector</text><text x="772" y="191" class="body">Retained 3D geometry + labels</text><text x="772" y="215" class="body">Live construct previews</text><text x="772" y="239" class="body">Floating projected screens</text><text x="772" y="263" class="body">Plane, curved and UV-mesh shapes</text><text x="772" y="287" class="body">Raster / camera / portal sources</text><text x="772" y="311" class="body">Configurable projection envelope</text></g><g><rect x="40" y="440" width="500" height="140" rx="14" class="card gold" /><text x="62" y="474" class="label">Existing local provider integration</text><text x="62" y="506" class="body">Other mods supply triangular meshes, RGBA frames,</text><text x="62" y="530" class="body">or leased GPU materials to HDR projected screens.</text><text x="62" y="554" class="body">Frame validity and resource lifetime remain provider-owned.</text></g><g><rect x="580" y="440" width="500" height="140" rx="14" class="card teal" /><text x="602" y="474" class="label">General client mod API</text><text x="602" y="506" class="body">Own local HUD / world contexts and retained content.</text><text x="602" y="530" class="body">Draw SVG, text, meshes and registered image materials.</text><text x="602" y="554" class="body">Cooperative hit testing; no automatic input capture.</text></g><text x="40" y="630" class="body">PB calls remain scoped to an authorized block and caller; they cannot request arbitrary client shaders.</text><text x="40" y="654" class="body">Projected surfaces accept content; existing HDR.UI hit regions currently attach to LCD / anchor planes.</text><text x="40" y="696" class="small">HDR API · architecture guide · solid = implemented; dashed = proposed</text></svg>