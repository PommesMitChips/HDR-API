<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="title desc"><title id="title">Combine content first, choose its surface second</title><desc id="desc">Vector artwork, raster interfaces and local video sources share layers and map onto authored display geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#46747b"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243541}.heading{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526573}.label{font-size:19px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#526573}.card{stroke-width:1.5}.teal{fill:#e3f0ef;stroke:#568b8b}.gold{fill:#fbf0d9;stroke:#b59657}.neutral{fill:#fff;stroke:#adbcc4}.proposed{fill:#f0edf7;stroke:#8e7fa5;stroke-dasharray:6 4}.flow{fill:none;stroke:#46747b;stroke-width:2.5}.divider{stroke:#c4d0d7;stroke-width:1.3;stroke-dasharray:5 5}</style><rect width="1120" height="742" rx="18" fill="#f4f7f9"/><text x="40" y="52" class="heading">Combine content first, choose its surface second</text><text x="40" y="82" class="sub">Vector artwork, raster interfaces and local video sources share layers and map onto authored display geometry.</text><g><rect x="40" y="125" width="220" height="165" rx="14" class="card teal"/><text x="62" y="159" class="label">Vector / SVG</text><text x="62" y="191" class="body">Paths and contours</text><text x="62" y="215" class="body">Text and shapes</text><text x="62" y="239" class="body">Client tessellation</text><text x="62" y="263" class="body">Scales from vector intent</text></g><g><rect x="310" y="125" width="220" height="165" rx="14" class="card teal"/><text x="332" y="159" class="label">Raster interface</text><text x="332" y="191" class="body">RGBA composition</text><text x="332" y="215" class="body">Resolution follows density</text><text x="332" y="239" class="body">Optional texture upload</text><text x="332" y="263" class="body">Alpha remains meaningful</text></g><g><rect x="580" y="125" width="220" height="165" rx="14" class="card gold"/><text x="602" y="159" class="label">Camera / portal</text><text x="602" y="191" class="body">Direct client capture</text><text x="602" y="215" class="body">Optional native renderer</text><text x="602" y="239" class="body">Texture + pose / validity</text><text x="602" y="263" class="body">No LCD buffer required</text></g><g><rect x="850" y="125" width="230" height="165" rx="14" class="card gold"/><text x="872" y="159" class="label">Other-mod source</text><text x="872" y="191" class="body">Prepared mesh / RGBA</text><text x="872" y="215" class="body">Leased local material</text><text x="872" y="239" class="body">Provider evidence</text><text x="872" y="263" class="body">Generation + release</text></g><path d="M150,290 L150,332" class="flow" marker-end="url(#arrow)"/><path d="M420,290 L420,332" class="flow" marker-end="url(#arrow)"/><path d="M690,290 L690,332" class="flow" marker-end="url(#arrow)"/><path d="M965,290 L965,332" class="flow" marker-end="url(#arrow)"/><g><rect x="40" y="340" width="1040" height="92" rx="14" class="card teal"/><text x="62" y="374" class="label">Compose retained content and layers</text><text x="62" y="406" class="body">Order • visibility • opacity • clipping • transforms • declarative animation</text></g><path d="M560,432 L560,477" class="flow" marker-end="url(#arrow)"/><g><rect x="40" y="490" width="310" height="150" rx="14" class="card teal"/><text x="62" y="524" class="label">Plane / cylinder</text><text x="62" y="556" class="body">Physical dimensions + local pose</text><text x="62" y="580" class="body">Canvas aspect: contain / cover / stretch</text><text x="62" y="604" class="body">Map vectors and textures to surface</text></g><g><rect x="405" y="490" width="310" height="150" rx="14" class="card teal"/><text x="427" y="524" class="label">Sphere / ellipsoid</text><text x="427" y="556" class="body">Angular or ray-based mapping</text><text x="427" y="580" class="body">Adaptive curved tessellation</text><text x="427" y="604" class="body">Independent front / back opacity</text></g><g><rect x="770" y="490" width="310" height="150" rx="14" class="card teal"/><text x="792" y="524" class="label">Authored UV mesh</text><text x="792" y="556" class="body">Positions + indexed triangles + UVs</text><text x="792" y="580" class="body">Barycentric vector mapping</text><text x="792" y="604" class="body">Duplicate vertices at UV seams</text></g><text x="40" y="676" class="body">All three present the same content model. Shape mapping does not reconstruct depth from camera images.</text><text x="40" y="718" class="small">HDR API · architecture guide · solid = implemented; dashed = proposed</text></svg>