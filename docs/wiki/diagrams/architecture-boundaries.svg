<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">Declarations travel; rendering stays on the viewer</title><desc id="desc">HDR separates shared display intent from client-local geometry, pixels and optional native capture.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#46747b" /></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243541}.heading{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526573}.label{font-size:19px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#526573}.card{stroke-width:1.5}.teal{fill:#e3f0ef;stroke:#568b8b}.gold{fill:#fbf0d9;stroke:#b59657}.neutral{fill:#fff;stroke:#adbcc4}.proposed{fill:#f0edf7;stroke:#8e7fa5;stroke-dasharray:6 4}.flow{fill:none;stroke:#46747b;stroke-width:2.5}.divider{stroke:#c4d0d7;stroke-width:1.3;stroke-dasharray:5 5}</style><rect width="1120" height="720" rx="18" fill="#f4f7f9" /><text x="40" y="52" class="heading">Declarations travel; rendering stays on the viewer</text><text x="40" y="82" class="sub">HDR separates shared display intent from client-local geometry, pixels and optional native capture.</text><g><rect x="40" y="125" width="310" height="172" rx="14" class="card teal" /><text x="62" y="159" class="label">Programmable block</text><text x="62" y="191" class="body">HDR.Draw / HDR.UI / HDR.Api</text><text x="62" y="215" class="body">Declare content, layers and actions</text><text x="62" y="239" class="body">Uses LCD, Console or Projector</text><text x="62" y="263" class="body">No GPU capture or rendering</text></g><g><rect x="405" y="125" width="310" height="172" rx="14" class="card teal" /><text x="427" y="159" class="label">World mod / server</text><text x="427" y="191" class="body">Validate bounded declarations</text><text x="427" y="215" class="body">Check caller and block access</text><text x="427" y="239" class="body">Replicate scene definitions</text><text x="427" y="263" class="body">Pixels and GPU leases stay local</text></g><path d="M350,210 L405,210" class="flow" marker-end="url(#arrow)" /><text x="363" y="184" class="small">calls</text><path d="M560,297 L560,337 L215,337 L215,385" class="flow" marker-end="url(#arrow)" /><text x="585" y="342" class="small">replicated declarations</text><g><rect x="40" y="385" width="350" height="190" rx="14" class="card teal" /><text x="62" y="419" class="label">Viewer: HDR world mod</text><text x="62" y="451" class="body">Compile SVG and vector geometry</text><text x="62" y="475" class="body">Map surfaces / depth-tested HUD</text><text x="62" y="499" class="body">Compose UI; pick native Use controls</text><text x="62" y="523" class="body">Apply local visibility and budgets</text><text x="62" y="547" class="body">Works without the optional plugin</text></g><g><rect x="460" y="385" width="350" height="190" rx="14" class="card gold" /><text x="482" y="419" class="label">Optional client renderer</text><text x="482" y="451" class="body">Upload raster UI textures</text><text x="482" y="475" class="body">Capture physical cameras directly</text><text x="482" y="499" class="body">Compose panoramas / native portals</text><text x="482" y="523" class="body">Validate and retain GPU resources</text><text x="482" y="547" class="body">Runs on each viewing client only</text></g><path d="M390,463 L460,463" class="flow" marker-end="url(#arrow)" /><text x="399" y="437" class="small">local</text><g><rect x="865" y="385" width="215" height="190" rx="14" class="card neutral" /><text x="887" y="419" class="label">Game renderer</text><text x="887" y="451" class="body">Depth and blending</text><text x="887" y="475" class="body">Native render passes</text><text x="887" y="499" class="body">Screen presentation</text><text x="887" y="523" class="body">One viewer / GPU</text></g><path d="M810,475 L865,475" class="flow" marker-end="url(#arrow)" /><path d="M390,545 L430,545 L430,596 L972,596 L972,575" class="flow" marker-end="url(#arrow)" /><text x="560" y="588" class="small">Direct vectors / near-clip HUD</text><g><rect x="40" y="610" width="1040" height="58" rx="14" class="card neutral" /><text x="62" y="644" class="label">Boundary: CamScan owns sensing, persistent observations and reconstruction.</text></g><text x="40" y="696" class="small">HDR API · architecture guide · solid = implemented; dashed = proposed</text><g><rect x="770" y="125" width="310" height="172" rx="14" class="card teal" /><text x="792" y="159" class="label">Trusted client mod</text><text x="792" y="191" class="body">HDR.ModClient/1</text><text x="792" y="215" class="body">Own HUD / world drawing contexts</text><text x="792" y="239" class="body">No PB identity or replication</text><text x="792" y="263" class="body">Cooperative pointer + local events</text></g><path d="M770,210 L743,210 L743,360 L365,360 L365,385" class="flow" marker-end="url(#arrow)" /></svg>